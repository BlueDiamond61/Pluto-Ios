workflows:
  ios-ui-build:
    name: Pluto iOS UI Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS app for Simulator
        script: |
          set -euo pipefail

          PROJECT_PATH="$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "No .xcodeproj found. Add or generate the native Xcode project before running this workflow."
            exit 1
          fi

          SCHEME="${XCODE_SCHEME:-}"
          if [ -z "$SCHEME" ]; then
            SCHEME="$(xcodebuild -list -json -project "$PROJECT_PATH" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          fi
          if [ -z "$SCHEME" ]; then
            echo "No shared Xcode scheme found. Share a scheme in Xcode or set XCODE_SCHEME in Codemagic environment variables."
            exit 1
          fi

          echo "Building $PROJECT_PATH using scheme $SCHEME"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - $CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/*.dSYM
